<nav class="navbar">
  <div class="logo">Gambling App</div>

  <a routerLink="/" class="nav-link">Play</a>
  <a routerLink="/labor" class="nav-link">Labor</a>
  @if (isAdmin()) {
    <a routerLink="/admin" class="nav-link">Admin Panel</a>
  }

  <div class="user-info">
    @if (userService.currentUser()) {
      <span class="username">{{ userService.currentUser()!.username }}</span>
      <span class="balance badge">{{ userService.currentUser()!.balance }} Coins</span>
      <button class="logout-btn" (click)="logout()">Logout</button>
    } @else {
      <span class="loading">Loading profile...</span>
    }
  </div>
</nav>

<main>
  <router-outlet></router-outlet>
</main>
