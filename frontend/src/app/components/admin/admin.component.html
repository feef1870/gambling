<div class="admin-container">
  <div class="admin-header">
    <h2>Admin Control Panel</h2>

    <div class="search-bar">
      <input
        type="text"
        [(ngModel)]="searchTerm"
        (keyup.enter)="onSearch()"
        placeholder="Search by username..."
      />
      <button type="button" (click)="onSearch()" class="btn-primary" [disabled]="isLoading()">Search</button>
    </div>
  </div>

  <table class="admin-table">
    <thead>
    <tr>
      <th>User ID</th>
      <th>Username</th>
      <th>Current Balance</th>
      <th>Action</th>
    </tr>
    </thead>
    <tbody>
      @for (user of users(); track user.id) {
        <tr>
          <td>{{ user.id }}</td>
          <td>{{ user.username || 'Unknown' }}</td>
          <td>{{ user.balance }} coins</td>
          <td class="action-cell">
            <input
              type="number"
              min="1"
              step="1"
              [ngModel]="amounts()[user.id] || null"
              (ngModelChange)="setAmount(user.id, $event)"
              [disabled]="isPending(user.id)"
              placeholder="Amount"
            />
            <button
              type="button"
              (click)="addMoney(user.id)"
              class="btn-primary"
              [disabled]="isPending(user.id)">
              {{ isPending(user.id) ? "Adding" : "Add" }}
            </button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="4" class="empty-state">No users found.</td>
        </tr>
      }
    </tbody>
  </table>

  <div class="pagination">
    <button
      type="button"
      (click)="prevPage()"
      [disabled]="isLoading() || currentPage() === 0"
      class="btn-secondary">
      Previous
    </button>

    <span class="page-info">
      Page {{ currentPage() + 1 }} of {{ totalPages() || 1 }}
    </span>

    <button
      type="button"
      (click)="nextPage()"
      [disabled]="isLoading() || currentPage() >= totalPages() - 1"
      class="btn-secondary">
      Next
    </button>
  </div>
</div>
