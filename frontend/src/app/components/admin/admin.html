<div class="admin-container">
  <div class="admin-header">
    <h2>Admin Control Panel</h2>

    <div class="search-bar">
      <input
        type="text"
        [(ngModel)]="searchTerm"
        (keyup.enter)="onSearch()"
        placeholder="Search by username..."
      />
      <button (click)="onSearch()" class="btn-primary">Search</button>
    </div>
  </div>

  <table class="admin-table">
    <thead>
    <tr>
      <th>User ID</th>
      <th>Username</th>
      <th>Current Balance</th>
      <th>Action</th>
    </tr>
    </thead>
    <tbody>
      @for (user of users(); track user.id) {
        <tr>
          <td>{{ user.id }}</td>
          <td>{{ user.username || 'Unknown' }}</td>
          <td>{{ user.balance }} coins</td>
          <td class="action-cell">
            <input
              type="number"
              [(ngModel)]="addAmount()[user.id]"
              placeholder="Amount"
              min="1"
            />
            <button (click)="addMoney(user.id)" class="btn-primary">Add</button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="4" class="empty-state">No users found.</td>
        </tr>
      }
    </tbody>
  </table>

  <div class="pagination">
    <button
      (click)="prevPage()"
      [disabled]="currentPage() === 0"
      class="btn-secondary">
      Previous
    </button>

    <span class="page-info">
      Page {{ currentPage() + 1 }} of {{ totalPages() || 1 }}
    </span>

    <button
      (click)="nextPage()"
      [disabled]="currentPage() >= totalPages() - 1"
      class="btn-secondary">
      Next
    </button>
  </div>
</div>
