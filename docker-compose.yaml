services:
  postgres:
    image: postgres:16
    container_name: gambling-db
    network_mode: host
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345678
      POSTGRES_DB: gambling
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./keycloak-config/keycloak-db-init.sql:/docker-entrypoint-initdb.d/01-keycloak-db.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gambling"]
      interval: 5s
      timeout: 5s
      retries: 12

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: gambling-keycloak
    network_mode: host
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8443"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://localhost:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
    volumes:
      - ./keycloak-config:/opt/keycloak/data/import:ro,z
    depends_on:
      postgres:
        condition: service_healthy

  ai-dealer:
    build: ./ai-dealer
    container_name: gambling-ai-dealer
    network_mode: host

  backend:
    build: ./backend
    container_name: gambling-backend
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: gambling-frontend
    network_mode: host
    depends_on:
      - backend

volumes:
  pgdata:
